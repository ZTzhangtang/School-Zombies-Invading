<script>
(function () {
  window.__bootOk = false;
  window.__bootErrors = [];
  window.addEventListener('error', function (e) {
    try {
      window.__bootErrors.push({
        msg: (e && e.message) || '未知错误',
        where: (e && e.filename ? String(e.filename).split('/').pop() : '') + (e && e.lineno ? ':' + e.lineno : ''),
        stack: e && e.error && e.error.stack ? String(e.error.stack).split('\n').slice(0, 4).join('\n') : ''
      });
      if (window.__bootOk) return;   /* 已成功启动后再出的错不抢屏 */
      var l = document.getElementById('loader'); if (l) l.style.display = 'none';
      var f = document.getElementById('fail');
      if (f) {
        f.style.display = 'flex'; f.style.textAlign = 'left';
        f.innerHTML = '<div style="max-width:560px">' +
          '<h2 style="color:#ff8a8a;margin:0 0 10px;letter-spacing:.08em">启动失败 · 脚本错误</h2>' +
          '<pre style="font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;color:#ffd9d2;' +
          'background:rgba(255,80,60,.08);border:1px solid rgba(255,90,70,.3);border-radius:8px;padding:12px;' +
          'max-height:40vh;overflow:auto">' +
          (e && e.message ? e.message : '') + '\n' +
          ((e && e.filename) ? String(e.filename).split('/').pop() + ':' + (e.lineno || '') : '') +
          ((e && e.error && e.error.stack) ? '\n\n' + String(e.error.stack).split('\n').slice(0, 4).join('\n') : '') +
          '</pre>' +
          '<p style="opacity:.7;font-size:12px;line-height:1.8">' +
          '可检查：① _shared/js/three.min.js 是否存在；② 浏览器是否支持 WebGL；③ 控制台 window.__bootErrors。</p></div>';
      }
    } catch (_) {}
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    try { window.__bootErrors.push({ msg: 'Promise: ' + (e && e.reason && e.reason.message || e.reason), where: '' }); } catch (_) {}
  });
})();
</script>

<script>/* ============================================================
 * keys.js — 生化·校园突围 统一键位系统
 *
 * 三张地图共用同一套键位表（默认照搬 map1 风格）：
 *   W/A/S/D  移动        Shift  疾跑
 *   F        开火        右键   开镜
 *   R        换弹        1 / 2  切换武器
 *   G        手雷
 *
 * 用法：
 *   Keys.actionOf(e.code)   → 动作名 或 null
 *   Keys.isDown(action)     → 该动作当前是否按下
 *   Keys.set(action, code)  / Keys.resetAll()  / Keys.on(cb)
 *   Keys.bindInput()        → 地图页调用一次，自动维护按下状态并派发事件
 *
 * 配置存 localStorage.zs_keys
 * ============================================================ */
window.Keys = (function () {
  'use strict';

  /* 动作定义：顺序即设置页展示顺序 */
  const ACTIONS = [
    { key: 'forward', label: '前进',      def: 'KeyW',          group: '移动' },
    { key: 'back',    label: '后退',      def: 'KeyS',          group: '移动' },
    { key: 'left',    label: '左移',      def: 'KeyA',          group: '移动' },
    { key: 'right',   label: '右移',      def: 'KeyD',          group: '移动' },
    { key: 'sprint',  label: '疾跑',      def: 'ShiftLeft',     group: '移动' },
    { key: 'fire',    label: '开火',      def: 'KeyF',          group: '战斗' },
    { key: 'reload',  label: '换弹',      def: 'KeyR',          group: '战斗' },
    { key: 'w1',      label: '武器 1',    def: 'Digit1',        group: '战斗' },
    { key: 'w2',      label: '武器 2',    def: 'Digit2',        group: '战斗' },
    { key: 'w3',      label: '武器 3',    def: 'Digit3',        group: '战斗' },
    { key: 'w4',      label: '武器 4',    def: 'Digit4',        group: '战斗' },
    { key: 'w5',      label: '武器 5',    def: 'Digit5',        group: '战斗' },
    { key: 'w6',      label: '武器 6',    def: 'Digit6',        group: '战斗' },
    { key: 'nade',    label: '手雷',      def: 'KeyG',          group: '战斗' }
  ];

  /* 所有武器槽动作（w1~w6）：用于统一做 preventDefault 判定 */
  const WP_ACTIONS = ACTIONS.filter(a => /^w[1-9]$/.test(a.key)).map(a => a.key);

  /* 疾跑额外允许 ShiftRight，两键同义 */
  const ALIAS = { sprint: ['ShiftLeft', 'ShiftRight'] };

  const LS = 'zs_keys';
  let map = {};                                  // action → code
  const down = {};                               // action → bool

  /* ---------- 读取 / 保存 ---------- */
  function defaults() {
    const m = {};
    ACTIONS.forEach(a => { m[a.key] = a.def; });
    return m;
  }
  function load() {
    map = defaults();
    try {
      const raw = JSON.parse(localStorage.getItem(LS) || '{}');
      for (const k in raw) if (k in map && typeof raw[k] === 'string') map[k] = raw[k];
    } catch (_) {}
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(map)); } catch (_) {} }

  /* code → 该 code 对应的所有动作（含别名） */
  function actionsOfCode(code) {
    const out = [];
    for (const a of ACTIONS) {
      const codes = ALIAS[a.key] || [map[a.key]];
      if (codes.indexOf(code) >= 0) out.push(a.key);
    }
    return out;
  }

  /* ---------- 事件派发 ---------- */
  const handlers = [];                            // { action, type:'down'|'up', fn }
  function on(action, type, fn) { handlers.push({ action, type, fn }); }
  function fire(action, type, code) {
    for (let i = 0; i < handlers.length; i++) {
      const h = handlers[i];
      if (h.action === action && h.type === type) {
        try { h.fn(code); } catch (_) {}
      }
    }
  }

  function setDown(action, v, code) {
    if (down[action] === v) return;
    down[action] = v;
    fire(action, v ? 'down' : 'up', code);
  }

  /* 同一动作可能有多个 code（如 Shift 左右）；用引用计数避免松开一个就误判为抬起 */
  const held = Object.create(null);               // code → count
  const holdCount = Object.create(null);          // action → count

  /* ---------- 对外：按下状态 ---------- */
  function isDown(action) { return !!down[action]; }
  function anyDown() {
    for (const k in down) if (down[k]) return true;
    return false;
  }

  /* ---------- 对外：键位读写 ---------- */
  function code(action) { return map[action]; }
  function actionOf(c) { const a = actionsOfCode(c); return a.length ? a[0] : null; }
  function set(action, c) {
    if (!(action in map) || !c) return;
    map[action] = c; save();
  }
  function resetAll() { map = defaults(); save(); }
  function resetOne(action) { map[action] = defaults()[action]; save(); }

  /* 键名 → 展示文案（给设置页用） */
  function pretty(c) {
    if (!c) return '—';
    if (/^Key([A-Z])$/.test(c)) return c.slice(3);
    if (/^Digit(\d)$/.test(c)) return c.slice(5);
    if (/^Numpad(\d)$/.test(c)) return '小键盘' + c.slice(6);
    if (c === 'ShiftLeft') return '左 Shift';
    if (c === 'ShiftRight') return '右 Shift';
    if (c === 'Space') return '空格';
    if (c === 'ControlLeft') return '左 Ctrl';
    if (c === 'AltLeft') return '左 Alt';
    if (c === 'ArrowUp') return '↑';
    if (c === 'ArrowDown') return '↓';
    if (c === 'ArrowLeft') return '←';
    if (c === 'ArrowRight') return '→';
    return c;
  }

  /* 冲突检测：返回与该 code 冲突的其它动作 label 数组 */
  function conflicts(action, c) {
    const out = [];
    for (const a of ACTIONS) {
      if (a.key === action) continue;
      const codes = ALIAS[a.key] || [map[a.key]];
      if (codes.indexOf(c) >= 0) out.push(a.label);
    }
    return out;
  }

  /* ---------- 自动接线：地图页调用一次 ---------- */
  let inputBound = false;
  function bindInput(opts) {
    if (inputBound) return;
    inputBound = true;
    opts = opts || {};
    /* 忽略在输入框里的按键 */
    const typing = e => {
      const t = e.target;
      return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    };

    window.addEventListener('keydown', function (e) {
      if (typing(e)) return;
      const acts = actionsOfCode(e.code);
      if (!acts.length) return;
      held[e.code] = (held[e.code] || 0) + 1;
      acts.forEach(a => {
        holdCount[a] = (holdCount[a] || 0) + 1;
        setDown(a, true, e.code);
      });
      /* 阻止数字键换枪时的浏览器默认（部分环境会切标签）与空格滚动 */
      if (acts.some(a => WP_ACTIONS.indexOf(a) >= 0)) e.preventDefault();
    });

    window.addEventListener('keyup', function (e) {
      const acts = actionsOfCode(e.code);
      if (!acts.length) return;
      acts.forEach(a => {
        holdCount[a] = Math.max(0, (holdCount[a] || 1) - 1);
        if (holdCount[a] === 0) setDown(a, false, e.code);
      });
      held[e.code] = Math.max(0, (held[e.code] || 1) - 1);
    });

    /* 失焦时清空全部按下状态，避免"卡住" */
    window.addEventListener('blur', function () {
      for (const a in down) if (down[a]) setDown(a, false, null);
      for (const k in holdCount) holdCount[k] = 0;
    });
  }

  load();

  return {
    ACTIONS, defaults, load, save,
    code, actionOf, actionsOfCode, set, resetAll, resetOne,
    isDown, anyDown, pretty, conflicts,
    on, bindInput,
    /* 便捷：注册某动作按下时的回调 */
    onDown: (action, fn) => on(action, 'down', fn),
    onUp:   (action, fn) => on(action, 'up',   fn),
    WP_ACTIONS
  };
})();
</script>
<script>/* ============================================================
 * settings.js — 生化·校园突围 跨地图统一设置
 *
 * index.html 写入的设置此前只有主菜单自己用，进图后全部失效。
 * 本模块让每张地图启动时调用 Settings.apply(gameCtx) 真正生效。
 *
 * 存储在 localStorage.zs_cfg（与 index.html 同一份）：
 *   { quality:'auto|low|mid|high', sens:1, vol:70, refl:true, fps:false, bgm:true }
 *
 * 地图页模板：
 *   Settings.apply({
 *     applyQuality:(level)=>{...},   // 可选：自定义画质应用
 *     getSens:()=>baseSens,          // 可选：返回基准灵敏度系数
 *     setSens:(v)=>{...},            // 可选：写回灵敏度
 *     getAudio:()=>AudioCtx,         // 可选：返回 AudioContext（用于音量）
 *     setRefl:(on)=>{...},           // 可选：开关湿地反射
 *     setFps:(on)=>{...},            // 可选：开关 FPS 显示
 *     setBgm:(on)=>{...}             // 可选：开关背景音乐（§6.3）
 *   });
 * ============================================================ */
window.Settings = (function () {
  'use strict';

  const LS = 'zs_cfg';
  const DEF = { map: 'map1', quality: 'auto', sens: 1, vol: 70, refl: true, fps: false, bgm: true };

  let cfg = Object.assign({}, DEF);

  function load() {
    try { cfg = Object.assign({}, DEF, JSON.parse(localStorage.getItem(LS) || '{}')); }
    catch (_) { cfg = Object.assign({}, DEF); }
    return cfg;
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch (_) {} }
  function get() { return cfg; }
  function set(k, v) { cfg[k] = v; save(); }

  /* 画质档 → 数值等级（低=0 中=1 高=2）；auto 交给地图自身的动态降质 */
  function qualityLevel() {
    switch (cfg.quality) {
      case 'low':  return 0;
      case 'mid':  return 1;
      case 'high': return 2;
      default:     return -1;            // auto
    }
  }

  /* 音量：0~100 → 0~1 */
  function volume() { return Math.max(0, Math.min(1, (+cfg.vol || 0) / 100)); }

  /* 灵敏度：设置值直接作为倍率 */
  function sens() { return Math.max(0.1, +cfg.sens || 1); }

  /* 把设置应用到当前地图。ctx 为可选回调集合 */
  function apply(ctx) {
    ctx = ctx || {};
    load();

    /* ① 画质 */
    const lv = qualityLevel();
    if (typeof ctx.applyQuality === 'function') {
      try { ctx.applyQuality(lv, cfg.quality); } catch (_) {}
    } else if (lv >= 0 && typeof window.applyQuality === 'function') {
      try { window.applyQuality(lv); } catch (_) {}
    }
    if (lv >= 0) window.__cfgQuality = lv; else window.__cfgQuality = null;

    /* ② 鼠标灵敏度 */
    window.__cfgSens = sens();
    if (typeof ctx.setSens === 'function') { try { ctx.setSens(sens()); } catch (_) {} }

    /* ③ 音量 */
    if (typeof ctx.getAudio === 'function') {
      try {
        const ac = ctx.getAudio();
        if (ac) window.__cfgGain = installGain(ac);
      } catch (_) {}
    }

    /* ④ 湿地反射 */
    if (typeof ctx.setRefl === 'function') { try { ctx.setRefl(!!cfg.refl); } catch (_) {} }
    window.__cfgRefl = !!cfg.refl;

    /* ⑤ FPS 显示 */
    if (typeof ctx.setFps === 'function') { try { ctx.setFps(!!cfg.fps); } catch (_) {} }
    window.__cfgFps = !!cfg.fps;
    applyFpsVisibility(!!cfg.fps);

    /* ⑥ §6.3 背景音乐开关 */
    if (typeof ctx.setBgm === 'function') { try { ctx.setBgm(cfg.bgm !== false); } catch (_) {} }
    window.__cfgBgm = (cfg.bgm !== false);
    if (window.BGM) { try { window.__cfgBgm ? window.BGM.on() : window.BGM.off(); } catch (_) {} }

    return cfg;
  }

  /* ---------- 音量：在 AudioContext 上装一个 master gain ---------- */
  function installGain(ac) {
    if (!ac || ac.__cfgGain) return ac && ac.__cfgGain;
    try {
      const g = ac.createGain();
      g.gain.value = volume();
      g.connect(ac.destination);
      /* 之后所有 source 都改接 g（地图代码里多为 source.connect(AC.destination)），
         这里无法拦截既有连接，故同时暴露 gain，由地图侧在创建时使用 */
      ac.__cfgGain = g;
    } catch (_) {}
    return ac && ac.__cfgGain;
  }

  /* ---------- FPS 显示 ---------- */
  function applyFpsVisibility(on) {
    const ids = ['fps', 'footer', 'fpsBox'];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = on ? '' : 'none';
    });
  }

  /* 监听 index 设置页变更（同源同窗口不会触发，跨窗口会） */
  window.addEventListener('storage', e => {
    if (e.key === LS) { load(); if (window.__cfgLiveApply) try { window.__cfgLiveApply(cfg); } catch (_) {} }
  });

  load();

  return {
    DEF, load, save, get, set, apply,
    qualityLevel, volume, sens,
    applyFpsVisibility, installGain,
    refresh: load
  };
})();
</script>
<script>/* ============================================================
 * profile.js — 生化·校园突围 个人档案与长期留存（§7）
 *
 * 与 settings.js / keys.js / touch-ui.js 并列的「三图共用」持久化模块：
 * 每张地图 + index 主菜单都以同一份 localStorage 记录玩家的长期战绩，
 * 并据此做「永久武器解锁」（§7.2 武器升级树，区别于 §4 的局内零件经济）。
 *
 * 存储键：localStorage.zs_profile（与 zs_cfg / zs_keys / zs_ui 互不干扰）
 *   {
 *     v: 2,
 *     total: { runs, kills, headshots, bestWave, bestTime, bestStreak, victories, wKills:{} },
 *     byMap: { map1:{...}, map2:{...}, map3:{...} },
 *     wpn:   { pistol:1, melee:1, ak:1, shotgun:1, smg:1, sniper:1 }   // §7.2 武器等级 1~3
 *   }
 *
 *   注：v1 → v2 平滑升级，旧数据缺字段一律补默认（sanitize 内处理），不会清档。
 *
 * 用法：
 *   一局结束时（死亡 / 胜利 / 全员阵亡）：
 *     if (window.Profile) Profile.recordRun({ map:'map1', kills, wave, timeS, victory:false,
 *                                             headshots, bestStreak, wKills });
 *
 *   进图初始化武器解锁（仅局内，不做全局持久化）：
 *     var wpUnlocked = { pistol:true, melee:true };
 *
 *   主菜单档案页：
 *     Profile.all()      // 全量
 *     Profile.get('map1')// 某图桶
 *     Profile.unlocks()  // 永久解锁表（由 total 换算）
 *
 *   §7.1 新增派生指标：
 *     Profile.headshotRate()  // 爆头率 0~1（headshots / kills）
 *     Profile.favWeapon()     // 最常用武器 key（按总击杀数），无数据返回 null
 *     Profile.favWeaponName() // 最常用武器中文名，无数据返回 '—'
 *
 *   §7.2 武器等级（每把 3 级，持久化）：
 *     Profile.wpnLevel('ak')     // 1~3，缺省 1
 *     Profile.wpnLevels()        // 全表副本 { pistol:2, ak:1, ... }
 *     Profile.setWpnLevel('ak',2)// 写入（自动夹取 1~3）
 *     Profile.upgradeWpn('ak')   // 升一级，返回新等级
 * ============================================================ */
window.Profile = (function () {
  'use strict';

  const LS = 'zs_profile';
  const VER = 2;
  const MAPS = ['map1', 'map2', 'map3'];
  /* §7.2 武器等级键（与 map 内 WPN_LEVEL 保持一致） */
  const WPN_KEYS = ['pistol', 'melee', 'ak', 'shotgun', 'smg', 'sniper'];
  const WPN_LV_MAX = 3;
  const WPN_NAMES = {
    pistol: '手枪', melee: '棒球棍', ak: 'AK-47',
    shotgun: '霰弹枪', smg: 'SMG', sniper: '狙击枪'
  };

  /* 单桶计数器 */
  function mkBucket() {
    return {
      runs: 0, kills: 0, headshots: 0,
      bestWave: 0, bestTime: 0, bestStreak: 0, victories: 0,
      wKills: {}                                   // 武器 → 击杀数（§7.1 最常用武器）
    };
  }
  /* 默认武器等级表 */
  function mkWpn() {
    const w = {};
    WPN_KEYS.forEach(k => { w[k] = 1; });
    return w;
  }
  /* 默认骨架（深拷贝，避免共享引用） */
  function mkDef() {
    const d = { v: VER, total: mkBucket(), byMap: {}, wpn: mkWpn() };
    MAPS.forEach(m => { d.byMap[m] = mkBucket(); });
    return d;
  }

  let data = mkDef();

  /* 把任意来源对象「规整」为合法骨架：缺字段补默认，数值强转非负整数 */
  function sanitize(raw) {
    const def = mkDef();
    if (!raw || typeof raw !== 'object') return def;
    function normWK(w) {
      const o = {};
      if (w && typeof w === 'object') {
        Object.keys(w).forEach(k => {
          const n = Math.max(0, (w[k] | 0) || 0);
          if (n > 0) o[k] = n;
        });
      }
      return o;
    }
    function normBucket(b) {
      const o = mkBucket();
      if (b && typeof b === 'object') {
        o.runs       = Math.max(0, (b.runs       | 0) || 0);
        o.kills      = Math.max(0, (b.kills      | 0) || 0);
        o.headshots  = Math.max(0, (b.headshots  | 0) || 0);
        o.bestWave   = Math.max(0, (b.bestWave   | 0) || 0);
        o.bestTime   = Math.max(0, (+b.bestTime  || 0));
        o.bestStreak = Math.max(0, (b.bestStreak | 0) || 0);
        o.victories  = Math.max(0, (b.victories  | 0) || 0);
        o.wKills     = normWK(b.wKills);
        /* 爆头数不可能多过击杀数，兜底校正（容忍旧数据/异常输入） */
        if (o.headshots > o.kills) o.headshots = o.kills;
      }
      return o;
    }
    def.total = normBucket(raw.total);
    MAPS.forEach(m => { def.byMap[m] = normBucket(raw.byMap && raw.byMap[m]); });
    /* v2 武器等级表：缺键补 1，越界夹取 */
    const w = mkWpn();
    if (raw.wpn && typeof raw.wpn === 'object') {
      WPN_KEYS.forEach(k => {
        const lv = (raw.wpn[k] | 0) || 1;
        w[k] = Math.min(WPN_LV_MAX, Math.max(1, lv));
      });
    }
    def.wpn = w;
    def.v = (raw.v | 0) || VER;
    return def;
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(LS) || 'null');
      data = sanitize(raw);
    } catch (_) {
      data = mkDef();                       // 解析失败 → 回到默认，不抛错
    }
    return data;
  }
  function save() {
    try { localStorage.setItem(LS, JSON.stringify(data)); } catch (_) {}
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- 写入一局战绩 ---------- */
  /* opt: { map, kills, wave, timeS, victory, headshots, bestStreak, wKills } */
  function recordRun(opt) {
    opt = opt || {};
    let map = opt.map;
    if (MAPS.indexOf(map) < 0) map = 'map1';           // 容错
    const kills = Math.max(0, (opt.kills | 0) || 0);
    const wave  = Math.max(0, (opt.wave  | 0) || 0);
    const timeS = Math.max(0, (+opt.timeS || 0));
    const win   = !!opt.victory;
    /* §7.1 新增：本局爆头数 / 最高连杀 / 武器击杀计数 */
    const heads = Math.min(kills, Math.max(0, (opt.headshots | 0) || 0));
    const streak= Math.max(0, (opt.bestStreak | 0) || 0);
    const wk    = (opt.wKills && typeof opt.wKills === 'object') ? opt.wKills : null;

    /* 未加载过（如首页直接调用）→ 先 load */
    apply(data.total, kills, heads, streak, wave, timeS, win, wk);
    apply(data.byMap[map], kills, heads, streak, wave, timeS, win, wk);
    save();
    return clone(data);
  }
  function apply(b, kills, heads, streak, wave, timeS, win, wk) {
    b.runs += 1;
    b.kills += kills;
    b.headshots += heads;
    if (streak > b.bestStreak) b.bestStreak = streak;
    if (wave  > b.bestWave) b.bestWave = wave;
    if (timeS > b.bestTime) b.bestTime = timeS;
    if (win) b.victories += 1;
    if (wk) {
      if (!b.wKills || typeof b.wKills !== 'object') b.wKills = {};
      Object.keys(wk).forEach(k => {
        const n = Math.max(0, (wk[k] | 0) || 0);
        if (n > 0) b.wKills[k] = (b.wKills[k] | 0) + n;
      });
    }
    if (b.headshots > b.kills) b.headshots = b.kills;
  }

  /* ---------- 读取 ---------- */
  function get(map) {
    if (MAPS.indexOf(map) < 0) map = 'map1';
    return clone(data.byMap[map]);
  }
  function all() { return clone(data); }
  function total() { return clone(data.total); }

  function reset() { data = mkDef(); save(); return clone(data); }

  /* ---------- §7.2 武器升级树：由累计战绩换算「永久解锁」（纯函数） ---------- */
  /* s: total 桶 { runs, kills, bestWave, bestTime, victories } */
  function computeUnlocks(s) {
    s = s || {};
    const kills = (s.kills | 0) || 0;
    const best  = (s.bestWave | 0) || 0;
    return {
      pistol:  true,
      melee:   true,
      ak:      kills >= 50,                       // 累计击杀 50
      shotgun: best  >= 5,                        // 最高抵达第 5 波
      smg:     kills >= 200 && best >= 8,         // 击杀 200 且抵达第 8 波
      sniper:  best  >= 12,                       // 最高抵达第 12 波
    };
  }
  /* 当前档案对应的解锁表 */
  function unlocks() { return computeUnlocks(data.total); }

  /* ---------- §7.1 派生指标 ---------- */
  /* 爆头率：0~1（无击杀时返回 0） */
  function headshotRate(map) {
    const b = map && MAPS.indexOf(map) >= 0 ? data.byMap[map] : data.total;
    const k = (b.kills | 0) || 0;
    if (k <= 0) return 0;
    return Math.min(1, ((b.headshots | 0) || 0) / k);
  }
  /* 最常用武器：按累计击杀数取最大者；无数据返回 null */
  function favWeapon(map) {
    const b = map && MAPS.indexOf(map) >= 0 ? data.byMap[map] : data.total;
    const wk = b.wKills || {};
    let best = null, bestN = 0;
    Object.keys(wk).forEach(k => {
      const n = (wk[k] | 0) || 0;
      if (n > bestN) { bestN = n; best = k; }
    });
    return best;
  }
  /* 最常用武器中文名（档案页直接显示） */
  function favWeaponName(map) {
    const k = favWeapon(map);
    return k ? (WPN_NAMES[k] || k) : '—';
  }

  /* ---------- §7.2 武器等级（持久化，1~3 级） ---------- */
  function clampLv(lv) {
    const n = (lv | 0) || 1;
    return Math.min(WPN_LV_MAX, Math.max(1, n));
  }
  function wpnLevel(key) {
    if (!key) return 1;
    return clampLv(data.wpn ? data.wpn[key] : 1);
  }
  function wpnLevels() {
    const o = {};
    WPN_KEYS.forEach(k => { o[k] = wpnLevel(k); });
    return o;
  }
  /* 直接设等级（1~3），写盘 */
  function setWpnLevel(key, lv) {
    if (!key) return 1;
    if (!data.wpn) data.wpn = mkWpn();
    data.wpn[key] = clampLv(lv);
    save();
    return data.wpn[key];
  }
  /* 升一级（封顶 WPN_LV_MAX），返回新等级 */
  function upgradeWpn(key) {
    if (!key) return 1;
    return setWpnLevel(key, wpnLevel(key) + 1);
  }

  /* ---------- 升级树进度（供档案页渲染） ---------- */
  /* 返回 [{ key, name, desc, cur, need, done }]，need 为阈值，cur 为进度值 */
  function tree() {
    const t = data.total;
    const kills = (t.kills | 0) || 0, best = (t.bestWave | 0) || 0;
    return [
      { key: 'pistol',  name: '手枪',   desc: '初始武器',                 cur: 1,     need: 1,     done: true },
      { key: 'melee',   name: '棒球棍', desc: '初始武器',                 cur: 1,     need: 1,     done: true },
      { key: 'ak',      name: 'AK-47',  desc: '累计击杀 50',              cur: kills, need: 50,    done: kills >= 50 },
      { key: 'shotgun', name: '霰弹枪', desc: '最高抵达第 5 波',          cur: best,  need: 5,     done: best  >= 5 },
      { key: 'smg',     name: 'SMG',    desc: '击杀 200 且抵达第 8 波',   cur: Math.min(kills / 200, best / 8), need: 1, done: (kills >= 200 && best >= 8) },
      { key: 'sniper',  name: '狙击枪', desc: '最高抵达第 12 波',         cur: best,  need: 12,    done: best  >= 12 },
    ];
  }

  /* 监听跨窗口（多个标签页 / index 与地图同源不同窗）变更 */
  window.addEventListener('storage', e => {
    if (e.key === LS) load();
  });

  load();

  return {
    LS, VER, MAPS,
    recordRun, get, all, total, reset,
    computeUnlocks, unlocks, tree,
    /* §7.1 */
    headshotRate, favWeapon, favWeaponName,
    /* §7.2 */
    WPN_KEYS, WPN_LV_MAX, WPN_NAMES,
    wpnLevel, wpnLevels, setWpnLevel, upgradeWpn,
    refresh: load
  };
})();
</script>

<script>
/* 内联自 bgm.js · 自动生成，勿手工编辑 */
/* ============================================================
 * bgm.js — 生化·校园突围 分层背景音乐（§6.3）
 *
 * 与 settings.js / profile.js 并列的「三图共用」模块。
 * 纯 WebAudio 程序化合成，不引入任何音频文件（零体积 / 零加载失败风险）。
 *
 * 四层：
 *   calm   平静 —— 低音 pad + 极缓 LFO（菜单 / 间歇）
 *   combat 战斗 —— 叠加八分音符低频脉冲（战斗中）
 *   horde  尸潮 —— 叠加十六分音符 + 噪声扫频（horde.active）
 *   down   濒死 —— 压低各层 + 心跳 + 耳鸣（玩家濒死）
 *
 * 用法：
 *   BGM.attach(() => AudioContext)   // 可选：复用地图页的 audio() 上下文
 *   BGM.set('calm'|'combat'|'horde'|'down')
 *   BGM.on() / off() / toggle()      // 开关（localStorage.zs_bgm）
 *
 * 说明：所有增益都挂在一个内部 masterGain 上；若地图页提供了
 * 自己的 AudioContext 与 master gain，则用 BGM.setVolume 与设置页音量联动。
 * ============================================================ */
window.BGM = (function () {
  'use strict';

  const LS = 'zs_bgm';
  const LAYERS = ['calm', 'combat', 'horde', 'down'];
  const VOL = { calm: 0.05, combat: 0.09, horde: 0.13, down: 0.10 };
  const FADE = 1.2;                         // 交叉淡入淡出时长（秒）

  let enabled = true, vol = 0.7;
  try {
    const raw = JSON.parse(localStorage.getItem(LS) || '{}');
    if (typeof raw.on === 'boolean') enabled = raw.on;
    if (typeof raw.vol === 'number') vol = Math.max(0, Math.min(1, raw.vol));
  } catch (_) {}

  let AC = null;
  let master = null;
  let userCtxGetter = null;
  let current = null;                       // 当前层名
  let nodes = {};                           // 每层的持续音源集合
  let started = false;

  function save() {
    try { localStorage.setItem(LS, JSON.stringify({ on: enabled, vol: vol })); } catch (_) {}
  }

  /* 取得 AudioContext：优先复用地图页 audio()，否则自建 */
  function ctx() {
    if (AC) { if (AC.state === 'suspended') { try { AC.resume(); } catch (_) {} } return AC; }
    try {
      if (userCtxGetter) { const c = userCtxGetter(); if (c) AC = c; }
    } catch (_) {}
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; }
    }
    if (!AC) return null;
    if (!master) {
      master = AC.createGain();
      master.gain.value = enabled ? vol : 0;
      master.connect(AC.destination);

    return AC;
  }

  /* 单个持续振荡器（可挂 LFO） */
  function drone(type, freq, detune, gainVal, lpf) {
    const a = ctx(); if (!a) return null;
    const o = a.createOscillator(); o.type = type; o.frequency.value = freq;

      const a = ctx(); if (!a || !enabled) return;
      const t = a.currentTime;
      const o = a.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + decay);
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gainVal * (enabled ? vol : 0), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + decay + 0.02);
    }, intervalMs);
    return id;
  }

  /* 构建某一层的持续音源（只建一次，用 gain 控制显隐） */
  function buildLayer(name) {
    if (nodes[name]) return nodes[name];
    const set = { gains: [], timers: [] };
    if (name === 'calm') {
      const a = drone('sine', 55, 0, 0.5, 400); if (a) set.gains.push(a);
      const b = drone('sine', 82.4, 7, 0.35, 500); if (b) set.gains.push(b);
    } else if (name === 'combat') {
      set.timers.push(pulseScheduler(73, 0.22, 500, 0.16));   // 八分音符
    } else if (name === 'horde') {
      set.timers.push(pulseScheduler(98, 0.20, 220, 0.12));   // 十六分音符
      set.timers.push(pulseScheduler(146, 0.14, 220, 0.10));
    } else if (name === 'down') {
      const a = drone('sine', 48, 0, 0.6, 300); if (a) set.gains.push(a);
      const ear = drone('sine', 4000, 0, 0.06, 6000); if (ear) set.gains.push(ear);  // 耳鸣
      set.timers.push(pulseScheduler(60, 0.30, 830, 0.20));   // 心跳
    }
    nodes[name] = set;
    return set;
  }

  /* 把某层的所有 gain 线性淡到目标值 */
  function fadeLayer(name, target, secs) {
    const a = ctx(); if (!a) return;
    const set = buildLayer(name);
    const t = a.currentTime;
    set.gains.forEach(x => {
      try {
        x.g.gain.cancelScheduledValues(t);
        x.g.gain.setValueAtTime(x.g.gain.value, t);
        x.g.gain.linearRampToValueAtTime(target, t + secs);
      } catch (_) {}
    });
  }
  function stopLayer(name, secs) {
    const a = ctx(); if (!a) return;
    const set = nodes[name]; if (!set) return;
    fadeLayer(name, 0, secs);
    set.timers.forEach(id => clearInterval(id));
    set.timers = [];
  }

  function set(name) {
    if (LAYERS.indexOf(name) < 0) name = 'calm';
    if (name === current && started) return;
    const a = ctx();
    if (!a) { current = name; return; }
    /* 淡出旧的持续层 */
    if (current && current !== name) stopLayer(current, FADE);
    else if (current && current === name) { /* 同层，保持 */ }
    /* 淡入新层 */
    const set = buildLayer(name);
    const base = VOL[name] || 0.06;
    const target = (enabled ? vol : 0) * base;
    set.gains.forEach(x => {
      if (!x.__started) { x.__started = true; }
    });
    fadeLayer(name, target, FADE);
    /* 若该层之前被 stopLayer 清掉了 timer，重建 */
    if (name === 'combat' && set.timers.length === 0) set.timers.push(pulseScheduler(73, 0.22, 500, 0.16));
    if (name === 'horde' && set.timers.length === 0) {
      set.timers.push(pulseScheduler(98, 0.20, 220, 0.12));
      set.timers.push(pulseScheduler(146, 0.14, 220, 0.10));
    }
    if (name === 'down' && set.timers.length === 0) set.timers.push(pulseScheduler(60, 0.30, 830, 0.20));
    current = name;
    started = true;
  }

  function applyMaster() {
    if (!master) return;
    const a = ctx(); if (!a) return;
    const t = a.currentTime;
    try {
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(enabled ? vol : 0, t + 0.4);
    } catch (_) {}
  }

  function on() { enabled = true; save(); applyMaster(); if (current) set(current); }
  function off() { enabled = false; save(); applyMaster(); }
  function toggle() { enabled ? off() : on(); return enabled; }
  function setVolume(v) { vol = Math.max(0, Math.min(1, +v || 0)); save(); applyMaster(); if (current && started) { /* 重新淡到新音量 */ const a = ctx(); if (a) { const base = VOL[current] || 0.06; fadeLayer(current, (enabled ? vol : 0) * base, 0.5); } } }

  function attach(getter) {
    if (typeof getter === 'function') { userCtxGetter = getter; AC = null; master = null; }
    return ctx() ? true : false;
  }

  return {
    LS, LAYERS, VOL,
    attach: attach,
    set: set,
    on: on, off: off, toggle: toggle,
    isOn: () => enabled,
    volume: () => vol,
    setVolume: setVolume,
    current: () => current,
    _ctx: () => AC,
    _master: () => master
  };
})();
</script>

<script>
/* 内联自 touch-ui.js · 自动生成，勿手工编辑 */
/* ============================================================
 * touch-ui.js —— 触屏按钮「统一布局 + 自定义位置」模块
 *
 * 解决的问题：
 *   1. 三张地图的触屏按钮各不相同（map1 有 6 个，map2/map3 只有 3 个）
 *   2. 按钮位置写死在 CSS 里，手机上够不到 / 挡视野，玩家无法自行调整
 *
 * 本模块提供：
 *   · 一套统一的 6 个按钮定义（开火/疾跑/换弹/瞄准/手雷/换枪）
 *   · 位置以【视口百分比】存储，跨手机尺寸一致
 *   · localStorage 持久化（键名 zs_ui），三张地图 + index 设置页共用
 *   · index 设置页可拖拽调整；地图内直接读取生效
 *
 * 坐标约定：
 *   pos = { x: 0..100, y: 0..100 }  表示按钮【中心】在视口中的百分比位置
 *   x=92 → 靠右, y=88 → 靠下
 *
 * 对外 API：
 *   TouchUI.ACTIONS            按钮定义数组
 *   TouchUI.baseSize()         当前屏幕下按钮基准像素（随屏宽自适应）
 *   TouchUI.get(action)        取某动作的位置（含默认回退）
 *   TouchUI.set(action, x, y)  写位置并保存
 *   TouchUI.resetAll()         恢复全部默认
 *   TouchUI.apply(scopeEl)     把位置套用到已存在的 [data-tbtn] 元素上
 *   TouchUI.watch(scopeEl)     监听窗口尺寸变化自动重算
 * ============================================================ */
window.TouchUI = (function () {
  'use strict';

  var LS = 'zs_ui';

  /* ---------- 统一按钮定义 ----------
   * action  : 逻辑动作名（与 keys.js 一致，便于语义对齐）
   * id      : 地图页里按钮的 DOM id
   * label   : 按钮显示文字
   * kind    : fire=大圆键 / normal=普通圆键
   * def     : 默认中心位置（视口百分比）；按右手拇指可及的右下弧线排布
   */
  var ACTIONS = [
    { action: 'fire',   id: 'tbtn-fire',   label: 'FIRE', kind: 'fire',   def: { x: 88, y: 84 } },
    { action: 'aim',    id: 'tbtn-aim',    label: '瞄准', kind: 'normal', def: { x: 88, y: 62 } },
    { action: 'reload', id: 'tbtn-reload', label: '换弹', kind: 'normal', def: { x: 70, y: 78 } },
    { action: 'nade',   id: 'tbtn-nade',   label: '手雷', kind: 'normal', def: { x: 62, y: 92 } },
    { action: 'swap',   id: 'tbtn-swap',   label: '换枪', kind: 'normal', def: { x: 74, y: 92 } },
    { action: 'sprint', id: 'tbtn-sprint', label: '疾跑', kind: 'normal', def: { x: 58, y: 64 } }
  ];

  var byAction = {};
  ACTIONS.forEach(function (a) { byAction[a.action] = a; });

  /* ---------- 读取 / 保存 ---------- */
  var map = {};                                   // action -> {x,y}
  function load() {
    map = {};
    ACTIONS.forEach(function (a) { map[a.action] = { x: a.def.x, y: a.def.y }; });
    try {
      var raw = JSON.parse(localStorage.getItem(LS) || '{}');
      for (var k in raw) {
        if (!byAction[k]) continue;
        var v = raw[k];
        if (v && typeof v.x === 'number' && typeof v.y === 'number') {
          map[k] = { x: clamp(v.x, 0, 100), y: clamp(v.y, 0, 100) };
        }
      }
    } catch (_) {}
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(map)); } catch (_) {} }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function get(action) {
    var d = byAction[action];
    if (!d) return null;
    var p = map[action];
    return p ? { x: p.x, y: p.y } : { x: d.def.x, y: d.def.y };
  }
  function set(action, x, y) {
    if (!byAction[action]) return;
    map[action] = { x: clamp(x, 0, 100), y: clamp(y, 0, 100) };
    save();
  }
  function resetOne(action) {
    var d = byAction[action];
    if (d) { map[action] = { x: d.def.x, y: d.def.y }; save(); }
  }
  function resetAll() {
    ACTIONS.forEach(function (a) { map[a.action] = { x: a.def.x, y: a.def.y }; });
    save();
  }

  /* ---------- 尺寸：基准像素随屏宽自适应（和旧 CSS 变量保持一致的量级） ---------- */
  function baseSize() {
    var w = (window.innerWidth || 375);
    if (w < 380) return { normal: 50, fire: 72 };
    if (w < 520) return { normal: 54, fire: 78 };
    if (w < 820) return { normal: 58, fire: 84 };
    return { normal: 60, fire: 86 };
  }

  /* ---------- 把位置套用到元素 ---------- */
  function applyEl(el, action) {
    if (!el) return;
    var p = get(action);
    if (!p) return;
    var d = byAction[action];
    var sz = baseSize();
    var px = (d.kind === 'fire') ? sz.fire : sz.normal;
    el.style.left = p.x + '%';
    el.style.top = p.y + '%';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.width = px + 'px';
    el.style.height = px + 'px';
    el.style.transform = 'translate(-50%, -50%)';
  }

  /* scopeEl 可为 document 或某个容器 */
  function apply(scopeEl) {
    load();
    var root = scopeEl || document;
    ACTIONS.forEach(function (a) {
      var el = root.querySelector('[data-tbtn="' + a.action + '"]') || document.getElementById(a.id);
      if (el) {
        el.setAttribute('data-tbtn', a.action);
        applyEl(el, a.action);
      }
    });
  }

  var watching = false;
  function watch(scopeEl) {
    if (watching) return;
    watching = true;
    var t = null;
    window.addEventListener('resize', function () {
      clearTimeout(t); t = setTimeout(function () { apply(scopeEl); }, 120);
    });
    window.addEventListener('orientationchange', function () {
      clearTimeout(t); t = setTimeout(function () { apply(scopeEl); }, 200);
    });
  }

  load();

  return {
    ACTIONS: ACTIONS,
    byAction: byAction,
    baseSize: baseSize,
    get: get, set: set, resetOne: resetOne, resetAll: resetAll,
    load: load, save: save,
    apply: apply, applyEl: applyEl, watch: watch
  };
})();

</script>
<script>

/* --- 沥青地面 --- */
function texAsphalt() {
  var c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#3c4147'; x.fillRect(0, 0, 512, 512);
  var i, px, py, v;
  for (i = 0; i < 260; i++) {
    px = rng() * 512; py = rng() * 512;
    var r = 20 + rng() * 60;
    var g = x.createRadialGradient(px, py, 0, px, py, r);
    var d = rng() * 0.09;
    g.addColorStop(0, 'rgba(20,22,26,' + d + ')');
    g.addColorStop(1, 'rgba(20,22,26,0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  for (i = 0; i < 14000; i++) {
    px = rng() * 512; py = rng() * 512;
    v = 52 + rng() * 66;
    x.fillStyle = 'rgba(' + (v | 0) + ',' + ((v + 3) | 0) + ',' + ((v + 8) | 0) + ',' + (0.16 + rng() * 0.3) + ')';
    x.fillRect(px, py, 1 + rng() * 1.6, 1 + rng() * 1.6);
  }
  for (i = 0; i < 60; i++) {
    px = rng() * 512; py = rng() * 512;
    x.strokeStyle = 'rgba(16,18,21,' + (0.1 + rng() * 0.12) + ')';
    x.lineWidth = 0.7;
    x.beginPath(); x.moveTo(px, py);
    for (var j = 0; j < 5; j++) { px += (rng() - 0.5) * 26; py += (rng() - 0.5) * 26; x.lineTo(px, py); }
    x.stroke();
  }
  return toTexture(c);
}

/* --- 楼房立面（玻璃幕墙网格） --- */
function texFacade(baseColor, glassA, glassB, litChance) {
  var c = makeCanvas(256, 256), x = c.getContext('2d');
  x.fillStyle = baseColor; x.fillRect(0, 0, 256, 256);
  var cols = 4, rows = 3;
  var mw = 256 / cols, mh = 256 / rows;
  var cw = mw * 0.68, ch = mh * 0.62;
  for (var r = 0; r < rows; r++) {
    for (var q = 0; q < cols; q++) {
      var px = q * mw + (mw - cw) / 2;
      var py = r * mh + (mh - ch) / 2;
      if (rng() < litChance) x.fillStyle = '#f4d9a4';
      else if (rng() < 0.5) x.fillStyle = glassA;
      else x.fillStyle = glassB;
      x.fillRect(px, py, cw, ch);
      x.fillStyle = 'rgba(255,255,255,0.16)';
      x.fillRect(px, py, cw, ch * 0.32);
      x.fillStyle = 'rgba(8,12,18,0.35)';
      x.fillRect(px, py + ch - 3, cw, 3);
    }
  }
  x.fillStyle = 'rgba(0,0,0,0.14)';
  for (r = 0; r <= rows; r++) x.fillRect(0, r * mh - 2, 256, 3);
  return toTexture(c);
}

/* --- 彩虹渐变 --- */

  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

function GeoBatch() {
  this.pos = []; this.nor = []; this.uv = []; this.idx = []; this.vc = 0;
}
GeoBatch.prototype.quad = function (p0, p1, p2, p3, n, uvs) {
  var b = this;
  b.pos.push(p0[0], p0[1], p0[2], p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2]);
  for (var i = 0; i < 4; i++) b.nor.push(n[0], n[1], n[2]);
  if (uvs) b.uv.push(uvs[0], uvs[1], uvs[2], uvs[3], uvs[4], uvs[5], uvs[6], uvs[7]);
  else b.uv.push(0, 0, 1, 0, 1, 1, 0, 1);
  b.idx.push(b.vc, b.vc + 1, b.vc + 2, b.vc, b.vc + 2, b.vc + 3);
  b.vc += 4;
};
GeoBatch.prototype.mesh = function (material) {
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
  g.setIndex(this.idx);
  return new THREE.Mesh(g, material);
};

function batchLine(b, x0, z0, x1, z1, w, y) {
  var dx = x1 - x0, dz = z1 - z0;
  var len = Math.hypot(dx, dz) || 1;
  var px = -dz / len * w / 2, pz = dx / len * w / 2;
  b.quad(
    [x0 + px, y, z0 + pz], [x1 + px, y, z1 + pz],
    [x1 - px, y, z1 - pz], [x0 - px, y, z0 - pz],
    [0, 1, 0]
  );
}

function batchArc(b, cx, cz, r, a0, a1, w, y, nseg) {
  nseg = nseg || 24;
  for (var i = 0; i < nseg; i++) {
    var t0 = a0 + (a1 - a0) * i / nseg;
    var t1 = a0 + (a1 - a0) * (i + 1) / nseg;
    var ri = r - w / 2, ro = r + w / 2;
    var c0 = Math.cos(t0), s0 = Math.sin(t0), c1 = Math.cos(t1), s1 = Math.sin(t1);
    b.quad(
      [cx + ri * c0, y, cz + ri * s0], [cx + ro * c0, y, cz + ro * s0],
      [cx + ro * c1, y, cz + ro * s1], [cx + ri * c1, y, cz + ri * s1],
      [0, 1, 0],
      [0, i / nseg, 1, i / nseg, 1, (i + 1) / nseg, 0, (i + 1) / nseg]
    );
  }
}

function stadiumSegPoint(L, r, seg, u) {
  if (seg === 0) {
    var a = -Math.PI / 2 - Math.PI * u;
    return { x: -L / 2 + r * Math.cos(a), z: r * Math.sin(a), nx: Math.cos(a), nz: Math.sin(a) };
  } else if (seg === 1) {
    return { x: -L / 2 + u * L, z: r, nx: 0, nz: 1 };
  } else if (seg === 2) {
    var a2 = Math.PI / 2 - Math.PI * u;
    return { x: L / 2 + r * Math.cos(a2), z: r * Math.sin(a2), nx: Math.cos(a2), nz: Math.sin(a2) };
  }
  return { x: L / 2 - u * L, z: -r, nx: 0, nz: -1 };
}

function batchStadiumStrip(b, L, rIn, rOut, y, uM, vM) {
  var counts = [44, 36, 44, 36];
  var samples = [];
  for (var sg = 0; sg < 4; sg++)
    for (var i = 0; i < counts[sg]; i++) samples.push({ sg: sg, u: i / counts[sg] });
  var total = samples.length;
  var width = rOut - rIn;
  var sAcc = 0;
  for (var k = 0; k < total; k++) {
    var s0 = samples[k], s1 = samples[(k + 1) % total];
    var pA0 = stadiumSegPoint(L, rIn, s0.sg, s0.u);
    var pB0 = stadiumSegPoint(L, rOut, s0.sg, s0.u);
    var pA1 = stadiumSegPoint(L, rIn, s1.sg, s1.u);
    var pB1 = stadiumSegPoint(L, rOut, s1.sg, s1.u);
    var u0 = sAcc / uM, u1 = (sAcc + Math.hypot(pA1.x - pA0.x, pA1.z - pA0.z)) / uM;
    var v1 = vM > 0 ? width / vM : 1;

      [pA0.x, y, pA0.z], [pB0.x, y, pB0.z],
      [pB1.x, y, pB1.z], [pA1.x, y, pA1.z],
      [0, 1, 0],
      [u0, 0, u1, 0, u1, v1, u0, v1]

    sAcc += Math.hypot(pA1.x - pA0.x, pA1.z - pA0.z);

  var counts = [44, 36, 44, 36];
  var samples = [];
  for (var sg = 0; sg < 4; sg++)
    for (var i = 0; i < counts[sg]; i++) samples.push({ sg: sg, u: i / counts[sg] });
  var total = samples.length;
  var sAcc = 0;
  for (var k = 0; k < total; k++) {
    var s0 = samples[k], s1 = samples[(k + 1) % total];
    var p0 = stadiumSegPoint(L, r, s0.sg, s0.u);
    var p1 = stadiumSegPoint(L, r, s1.sg, s1.u);
    var u0 = sAcc / uM, u1 = (sAcc + Math.hypot(p1.x - p0.x, p1.z - p0.z)) / uM;
    var n = [p0.nx, 0, p0.nz];
    b.quad(
      [p0.x, y0, p0.z], [p0.x, y1, p0.z],
      [p1.x, y1, p1.z], [p1.x, y0, p1.z],
      n, [u0, 0, u0, 1, u1, 1, u1, 0]
    );
    sAcc += Math.hypot(p1.x - p0.x, p1.z - p0.z);
  }

function cylinderBetween(p0, p1, r, mat) {
  var d = new THREE.Vector3().subVectors(p1, p0);

  var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);

  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}

function makeBuilding(w, h, d, x, z, tex, winRepeatX, winRepeatZ) {
  var grp = new THREE.Group();
  var T = 0.45;
  var doorW = 3.0, doorH = 3.2;
  var innerH = Math.min(h - 1.5, 6.0);

  var wallMat = new THREE.MeshStandardMaterial({ color: 0xb8b5a8, roughness: 0.92 });
  var inFloorMat = new THREE.MeshStandardMaterial({ color: 0x8f948c, roughness: 0.95 });
  var deskMat = new THREE.MeshStandardMaterial({ color: 0x7d6a52, roughness: 0.85 });
  var roofMat = new THREE.MeshStandardMaterial({ color: 0x6d747c, roughness: 0.95 });
  var lampMat = new THREE.MeshBasicMaterial({ color: 0xfff1c8 });
  var warnMat = new THREE.MeshStandardMaterial({ color: 0x66121c, emissive: 0xd42a3c, emissiveIntensity: 1.8, roughness: 0.4 });

  function skin(rx, ry) {
    var t = tex.clone();
    t.needsUpdate = true;
    t.repeat.set(rx, ry);
    return new THREE.MeshStandardMaterial({ map: t, roughness: 0.85 });
  }
  function addBox(bw, bh, bd, px, py, pz, mat, collide) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
    m.position.set(px, py, pz);
    m.castShadow = true; m.receiveShadow = true;
    grp.add(m);
    if (collide) {
      addCollider(x + px - bw / 2 - 0.05, x + px + bw / 2 + 0.05,
        z + pz - bd / 2 - 0.05, z + pz + bd / 2 + 0.05);
    }
    return m;
  }
  function addSkin(bw, bh, px, py, pz, ry) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh), skin(bw / 8, bh / 8));
    m.position.set(px, py, pz);
    m.rotation.y = ry;
    m.receiveShadow = true;
    grp.add(m);
    return m;
  }

  addBox(w, h, T, 0, h / 2, -d / 2 + T / 2, wallMat, true);
  addBox(w, h, T, 0, h / 2, d / 2 - T / 2, wallMat, true);
  addBox(T, h, d, -w / 2 + T / 2, h / 2, 0, wallMat, true);
  var segLen = (d - doorW) / 2;
  addBox(T, h, segLen, w / 2 - T / 2, h / 2, -(doorW / 2 + segLen / 2), wallMat, true);
  addBox(T, h, segLen, w / 2 - T / 2, h / 2, (doorW / 2 + segLen / 2), wallMat, true);
  addBox(T, h - doorH, doorW, w / 2 - T / 2, doorH + (h - doorH) / 2, 0, wallMat, false);

  addSkin(w, h, 0, h / 2, -d / 2 - 0.02, Math.PI);
  addSkin(w, h, 0, h / 2, d / 2 + 0.02, 0);
  addSkin(d, h, -w / 2 - 0.02, h / 2, 0, Math.PI / 2);
  addSkin(segLen, h, w / 2 + 0.02, h / 2, -(doorW / 2 + segLen / 2), -Math.PI / 2);
  addSkin(segLen, h, w / 2 + 0.02, h / 2, (doorW / 2 + segLen / 2), -Math.PI / 2);
  addSkin(doorW, h - doorH, w / 2 + 0.02, doorH + (h - doorH) / 2, 0, -Math.PI / 2);

  var fl = new THREE.Mesh(new THREE.BoxGeometry(w - 2 * T, 0.12, d - 2 * T), inFloorMat);
  fl.position.y = 0.06;
  fl.receiveShadow = true;
  grp.add(fl);
  var ceil = new THREE.Mesh(new THREE.BoxGeometry(w - 2 * T, 0.18, d - 2 * T), wallMat);
  ceil.position.y = innerH;
  grp.add(ceil);
  [-1, 1].forEach(function (sx) {
    var strip = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.08, d * 0.88), lampMat);
    strip.position.set(sx * w * 0.2, innerH - 0.12, 0);
    grp.add(strip);
  });
  var pl = new THREE.PointLight(0xffeecc, 44, Math.max(w, d) * 0.95, 1.6);
  pl.position.set(0, innerH - 0.7, 0);
  grp.add(pl);

  var rows = Math.max(2, Math.floor((d - 10) / 7));
  for (var r = 0; r < rows; r++) {
    var zOff = -d / 2 + 6 + r * ((d - 12) / Math.max(1, rows - 1));
    for (var cx = -1; cx <= 1; cx += 2) {
      addBox(1.5, 0.74, 0.8, cx * (w * 0.18), 0.37, zOff, deskMat, true);
    }
  }

  var dl = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, 0.25), warnMat);
  dl.position.set(w / 2 + 0.1, doorH + 0.35, 0);
  grp.add(dl);

  var roof = new THREE.Mesh(new THREE.BoxGeometry(w - 0.3, 0.3, d - 0.3), roofMat);
  roof.position.y = h - 0.15;
  roof.castShadow = true;
  grp.add(roof);
  var parapet = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.7, d + 0.6), roofMat);
  parapet.position.y = h + 0.3;
  grp.add(parapet);
  var tank = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 2.2, 14),
    new THREE.MeshStandardMaterial({ color: 0x9aa4ae, roughness: 0.6, metalness: 0.3 }));
  tank.position.set(w * 0.25, h + 1.6, -d * 0.2);
  grp.add(tank);
  var ac = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.1, 1.6),
    new THREE.MeshStandardMaterial({ color: 0x84898f, roughness: 0.8 }));
  ac.position.set(-w * 0.2, h + 0.8, d * 0.25);
  grp.add(ac);
  grp.position.set(x, 0, z);
  scene.add(grp);
  return grp;
}

(function buildRainbow() {

  for (var i = 0; i < nseg; i++) {

      [r0 * Math.cos(a1), r0 * Math.sin(a1), 0],

    );

  g.setAttribute('aSpeed', new THREE.BufferAttribute(spd, 1));
  g.setAttribute('aOff', new THREE.BufferAttribute(off, 1));
  var mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,

      uTime: sharedU.uTime,

    },

      'attribute float aSpeed;',
      'attribute float aOff;',
      'uniform float uTime;',
      'uniform float uPR;',
      'varying float vA;',
      'void main() {',
      '  vec3 p = position;',

      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  gl_Position = projectionMatrix * mv;',
      '  float ps = (300.0 / max(-mv.z, 1.0)) * uPR;',
      '  gl_PointSize = clamp(ps, 3.2, 30.0);',

      'uniform float uOpacity;',

      '  float a = smoothstep(0.5, 0.05, abs(pc.x)) * smoothstep(0.5, 0.14, abs(pc.y)) * vA * uOpacity * 0.8;',
      '  gl_FragColor = vec4(0.66, 0.75, 0.88, a);',

/* ---------- 移动端虚拟摇杆 ---------- */
var joyMove = { x: 0, y: 0, active: false };
var JOY_R = 56;
var joyEl = document.getElementById('joy-move');
var joyThumb = document.getElementById('joyMoveThumb');
var joyCenter = { x: 0, y: 0 };
var joyId = -1;

function joyStart(e) {
  /* ★ 修复（多点触控互相干扰）：原先取 e.touches[0]，即"屏幕上最早已按下的触点"。
     当用户先在右侧长按（转动视角）后再按下左侧摇杆时，touches[0] 仍是右侧那个
     触点，于是 joyId 被错误地绑定到右侧手指上 —— 之后无论怎样操作摇杆，
     joyTrack 都在跟随右手指的坐标，摇杆就"飘"向右侧触点。
     正确做法：只认本次真正落在摇杆上的那一根手指（changedTouches[0]）。
     若摇杆已被占用（joyId !== -1），忽略后来的触点。 */
  if (joyId !== -1) { e.preventDefault(); return; }
  var t = (e.changedTouches && e.changedTouches[0]) || e.touches[0];
  if (!t) return;
  joyId = t.identifier;
  var r = joyEl.getBoundingClientRect();
  joyCenter.x = r.left + r.width / 2;
  joyCenter.y = r.top + r.height / 2;
  var dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
  var d = Math.hypot(dx, dy);
  if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; d = JOY_R; }
  joyMove.x = dx / JOY_R;
  joyMove.y = dy / JOY_R;
  joyMove.active = d > 8;
  if (joyThumb) joyThumb.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  e.preventDefault();
}
function joyTrack(e) {
  for (var i = 0; i < e.touches.length; i++) {
    if (e.touches[i].identifier !== joyId) continue;
    var t = e.touches[i];
    var dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
    var d = Math.hypot(dx, dy);
    if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; d = JOY_R; }
    joyMove.x = dx / JOY_R;
    joyMove.y = dy / JOY_R;
    joyMove.active = d > 8;
    if (joyThumb) joyThumb.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    e.preventDefault();
    return;
  }
  /* ★ 摇杆指针对应的手指若已不在（异常丢失），立刻复位，避免"卡住" */
  if (joyId !== -1) {
    var stillHere = false;
    for (var j = 0; j < e.touches.length; j++) {
      if (e.touches[j].identifier === joyId) { stillHere = true; break; }
    }
    if (!stillHere) joyReset();
  }
}
function joyReset() {
  joyId = -1;
  joyMove.x = 0; joyMove.y = 0; joyMove.active = false;
  if (joyThumb) joyThumb.style.transform = 'translate(0px,0px)';
}
function joyEnd(e) {
  /* ★ 用 changedTouches 精确匹配摇杆指针；只有"绑定的那根手指"抬起才复位，
     抬其他手指（例如右侧视角手指）不影响摇杆。 */
  if (!e.changedTouches) { joyReset(); return; }
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joyId) { joyReset(); return; }
  }
}
if (joyEl) {
  joyEl.addEventListener('touchstart', joyStart, { passive: false });
  joyEl.addEventListener('touchmove', joyTrack, { passive: false });
  joyEl.addEventListener('touchend', joyEnd);
  joyEl.addEventListener('touchcancel', joyEnd);
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

var _fwd = new THREE.Vector3();
var _rgt = new THREE.Vector3();
var _look = new THREE.Vector3();

function updateControls(dt) {
  /* ★ 观战：自由飞行（穿墙、无视碰撞与受击） */
  if (window.MP && MP.spectating()) {
    _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    _rgt.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    var sx = 0, sz = 0, su = 0;
    if (Keys.isDown('forward')) sz += 1;
    if (Keys.isDown('back'))    sz -= 1;
    if (Keys.isDown('left'))    sx -= 1;
    if (Keys.isDown('right'))   sx += 1;
    if (Keys.isDown('sprint'))  su += 1;
    var ssp = 16 * dt;
    player.pos.x += (_fwd.x * sz + _rgt.x * sx) * ssp;
    player.pos.z += (_fwd.z * sz + _rgt.z * sx) * ssp;
    player.pos.y = Math.max(0.6, player.pos.y + su * ssp - player.pitch * sz * ssp);
    camera.position.set(player.pos.x, player.pos.y, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    return;
  }
  _fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  _rgt.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  var mvx = 0, mvz = 0;
  if (Keys.isDown('forward')) mvz += 1;
  if (Keys.isDown('back'))    mvz -= 1;
  if (Keys.isDown('left'))    mvx -= 1;
  if (Keys.isDown('right'))   mvx += 1;
  if (joyMove.active) { mvx += joyMove.x; mvz += -joyMove.y; }

  var wantSprint = !!(Keys && Keys.isDown && Keys.isDown('sprint')) || game.sprintToggle || game.sprintHeld;
  var ml = Math.hypot(mvx, mvz);
  var moving = ml > 0.001 && !game.dead;

  game.sprinting = moving && wantSprint && game.stamina > 1.5;
  if (game.sprinting) game.stamina = Math.max(0, game.stamina - 26 * dt);
  else game.stamina = Math.min(100, game.stamina + 15 * dt);
  /* ★ 切换式疾跑：体力耗尽时自动关闭 toggle，并同步按钮高亮，
     避免出现"按钮亮着但不疾跑"的错觉状态 */
  if (game.sprintToggle && game.stamina <= 1.5) {
    game.sprintToggle = false;
    if (btnSprint) btnSprint.classList.remove('on');
  }

  if (moving) {
    var inv = ml > 1 ? 1 / ml : 1;
    /* ★ §3.2 职业移速加成 + 突击兵突进 */
    var clsSpd = (window.__CLS && window.__CLS.spdMul) ? window.__CLS.spdMul : 1;
    var dashMul = (window.__dashT > 0) ? 1.60 : 1.0;
    var sp = (game.sprinting ? P_RUN : P_WALK) * dt * inv * clsSpd * dashMul;
    player.pos.x += (_fwd.x * mvz + _rgt.x * mvx) * sp;
    player.pos.z += (_fwd.z * mvz + _rgt.z * mvx) * sp;
    player.bob += dt * (game.sprinting ? 13.5 : 9);
  } else {
    player.bob *= Math.max(0, 1 - dt * 6);
  }

  var cr = collideXZ(player.pos.x, player.pos.z, 0.42);
  player.pos.x = clamp(cr[0], P_BOUND.x0, P_BOUND.x1);
  player.pos.z = clamp(cr[1], P_BOUND.z0, P_BOUND.z1);
  var bobY = Math.sin(player.bob) * (game.sprinting ? 0.075 : 0.045) * (moving ? 1 : 0);
  /* ★ §1.2 开镜时摆动大幅衰减（克制） */
  bobY *= (game.aiming ? 0.15 : 1);
  /* ★ §1.2 准星扩散：静止基准 + 移动/疾跑外扩 - 开镜收敛；开火脉冲见 weaponFire */
  var _ct = Math.max(1.5, 4 + (moving ? 7 : 0) + (game.sprinting ? 5 : 0) - (game.aiming ? 4.5 : 0));
  crossSpread += (_ct - crossSpread) * Math.min(1, dt * 9);
  if (crossSpread > _ct + 0.01) crossSpread = Math.max(_ct, crossSpread - dt * 22);
  if (crosshairEl) crosshairEl.style.setProperty('--sp', crossSpread.toFixed(2) + 'px');
  if (crosshairEl) crosshairEl.classList.toggle('ads', !!game.aiming);

  var wantFov = game.aiming ? 38 : (game.sprinting ? 66 : 55);
  camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 7);
  camera.updateProjectionMatrix();

  var cp = Math.cos(player.pitch);
  _look.set(cp * -Math.sin(player.yaw), Math.sin(player.pitch), cp * -Math.cos(player.yaw));
  camera.position.set(player.pos.x, P_EYE + bobY, player.pos.z);
  /* ★ 修复（相机倒转）：原先用 camera.lookAt() 设置朝向。
     lookAt 内部走默认 'XYZ' 欧拉分解，当 yaw 越过 ±90° 时分解会翻转
     （rotation.x 变为 ±π），随后主循环再写 camera.rotation.z（被咬侧倾 / 归零）
     就会在这个已翻转的欧拉上二次改写，导致相机整体上下颠倒
     —— 表现为"视角转到远离主席台那一面，天空在下、地在上了"。
     改用与 map3 一致的 'YXZ' 顺序 + rotation.set(pitch, yaw, roll)，
     朝向稳定，且侧倾(roll)天然工作在正确轴上。 */
  camera.rotation.order = 'YXZ';
  camera.rotation.set(player.pitch, player.yaw, camera.rotation.z);
}

(function buildGun() {
  var body = new THREE.MeshStandardMaterial({ color: 0x454c54, roughness: 0.42, metalness: 0.6 });
  var grip = new THREE.MeshStandardMaterial({ color: 0x2a2e35, roughness: 0.85 });
  var acc = new THREE.MeshStandardMaterial({ color: 0x1f242b, roughness: 0.4, metalness: 0.6 });
  var wood = new THREE.MeshStandardMaterial({ color: 0x6d4626, roughness: 0.78 });
  var brass = new THREE.MeshStandardMaterial({ color: 0xb98a3c, roughness: 0.32, metalness: 0.9 });
  /* 每个槽位建一个子组，便于整组显隐 */
  function slot() { var g = new THREE.Group(); gunGrp.add(g); return g; }
  function part(g, w, h, d, x, y, z, mat) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || body);
    m.position.set(x, y, z); g.add(m); return m;

  /* 0 手枪：短小 */

  for (var t = 0; t < 24; t++) {

    var zb = makeZombie('normal', opts);
    zb.grp.position.set(x, 0, z);
    zombies.push(zb);
    /* ★ 联机：注册到全局数组 + 稳定 id，供 zsync 序列化广播 */

    s.vy -= 9.8 * dt;
    s.m.position.x += s.vx * dt; s.m.position.y += s.vy * dt; s.m.position.z += s.vz * dt;
    s.m.rotation.x += s.sx * dt; s.m.rotation.y += s.sy * dt; s.m.rotation.z += s.sz * dt;
    /* 地面高度：map2 平坦，取 0（跑道/操场） */
    if (s.m.position.y <= 0.012) {
      s.m.position.y = 0.012;
      if (s.bounce < 1) { s.vy = Math.abs(s.vy) * 0.32; s.vx *= 0.55; s.vz *= 0.55; s.sx *= 0.5; s.sz *= 0.5; s.bounce++; }
      else {
        s.vy = 0; s.vx *= Math.pow(0.02, dt); s.vz *= Math.pow(0.02, dt);
        s.m.rotation.x += (Math.PI / 2 - s.m.rotation.x) * Math.min(1, dt * 6);
        s.sx *= 0.9; s.sz *= 0.9; s.life = Math.min(s.life, 0.35);
      }
    }
  }
}

/* ---------- 射击：射线 vs 丧尸头/身球体 ---------- */
var _rd = new THREE.Vector3();
var _va = new THREE.Vector3();
function fireRayHit() {
  camera.getWorldDirection(_rd);
  var o = camera.position;
  /* ★ 近战射程限制：W.range 存在时超过该距离视为未命中（射程已 ×3） */
  var maxR = (W && W.range) ? W.range : 1e9;
  var best = null, bestT = 1e9;
  for (var i = 0; i < zombies.length; i++) {
    var z = zombies[i];
    if (z.dead) continue;
    for (var s = 0; s < 2; s++) {
      var sy = s === 0 ? 1.58 : 0.95;
      var sr = s === 0 ? 0.30 : 0.48;
      _va.set(z.grp.position.x, sy * z.grp.scale.y, z.grp.position.z).sub(o);
      var tca = _va.dot(_rd);
      if (tca < 0) continue;
      var d2 = _va.lengthSq() - tca * tca;
      if (d2 > sr * sr) continue;
      var t = tca - Math.sqrt(sr * sr - d2);
      if (t > maxR) continue;                 // ★ 超出近战射程 → 不计入命中
      if (t < bestT) {
        bestT = t;
        best = { z: z, hs: s === 0 };
      }
    }
  }
  return best;
}

function weaponFire() {
  if (game.dead || game.reloading || game.fireCd > 0) return;
  if (window.MP && MP.spectating()) return;                 // ★ 观战不可开火
  var isMelee = (W.gun === false);
  var headMul = (W.key === 'pistol') ? 2 : 3;        // ★ 清单④：手枪爆头倍率减半（2），其他 3
  /* ★ 清单⑤：每把枪独立弹匣；打空弹匣自动换弹，从共享储备 game.ammo 补满 */
  if (W.usesAmmo) {
    if (game.mag <= 0) { weaponReload(); return; }
    game.mag--;
  }
  game.fireCd = W.cd;
  game.recoil = W.blast ? 2.4 : (isMelee ? 1.1 : 1);
  /* ★ 近战：不做枪口火光，改为挥击动画（棒球棍不发子弹） */
  if (isMelee) { game.meleeSwingT = MELEE_SWING_DUR; }
  else {
    muzzle.material.opacity = 1;
    muzzle.rotation.z = Math.random() * Math.PI;
    muzzleLight.intensity = 24;
  }
  player.pitch = clamp(player.pitch + (W.blast ? 0.028 : (isMelee ? 0.01 : 0.012)), -1.45, 1.45);
  /* ★ §1.2 弹壳抛出（近战不抛） + 准星开火脉冲 */
  if (!isMelee) ejectShell();
  crossSpread += 1.6 + (W.blast ? 3.0 : 1.0);
  updateHUD(1);
  var hit = fireRayHit();
  if (hit) {
    var isClient = !!(window.ZS && window.ZS.isClient());
    if (isClient && window.P2P) {
      /* ★ 联机：客户端按丧尸稳定 id 上报房主，由房主结算伤害 */
      var g2 = W_SLOTS[wIdx].blast ? null : hit.z.grp;
      if (W_SLOTS[wIdx].blast) {
        /* 霰弹：近距离溅射，按 id 上报多枚 */
        for (var bi = 0, bn = 0; bi < W_SLOTS[wIdx].pellets; bi++) {
          var bh = fireRayHit();
          if (bh && bh.z && !bh.z.dead) {
            var bid = window.ZS && ZS.idOf ? ZS.idOf(bh.z.grp) : null;
            if (bid) { P2P.sendHitZombie(bid, bh.hs ? Math.round(W.damage * headMul) : W.damage); bn++; }
          }
        }
        if (bn) game.hitmarkT = 0.14;
      } else {
        var gid = window.ZS && ZS.idOf ? ZS.idOf(g2) : null;
        if (gid) P2P.sendHitZombie(gid, hit.hs ? Math.round(W.damage * headMul) : W.damage);
        game.hitmarkT = 0.14;
      }
    } else {
      /* 房主 / 单机：本地结算；近战秒杀非 BOSS */
      var lethal = false;
      if (isMelee && hit.z && !hit.z.boss) { damageZombie(hit.z, 9999); lethal = true; }
      else {
        var dmg = hit.hs ? W.damage * headMul : W.damage;   // ★ 清单④：爆头倍率（手枪2/其他3），加成伤害不秒杀
        lethal = !!(hit.z && !hit.z.boss && (hit.z.hp - dmg * (hit.hs ? 1 : armorMulMap2(hit.z, {}))) <= 0);
        damageZombie(hit.z, dmg, hit.hs);   // ★ §2.1 传爆头标志，装甲减伤在 damageZombie 内统一处理
      }
      sfxHit(!!hit.hs, lethal);          // ★ §1.2 爆头音效三档
      game.hitmarkT = 0.14;
    }
  }
}

function buyItem(id){
  function fail(m){ return { ok:false, msg:m }; }
  if (WPN_PRICE[id] !== undefined) {
    if (wpUnlocked[id]) return fail('已拥有');
    var cost = WPN_PRICE[id];
    if (credits < cost) return fail('零件不足');
    credits -= cost; wpUnlocked[id] = true; updSlots();
    buyLog.push({ id:id, cost:cost });
    var w = W_SLOTS.find(function(x){ return x.key === id; });
    banner('已解锁 · ' + (w ? w.name : id));
    return { ok:true, msg:'已解锁' };

  if (id === 'ammo') {
    if (game.ammo >= AMMO_MAX_BASE) return fail('弹药已满');
    if (credits < PRICE_AMMO_REFILL) return fail('零件不足');

    buyLog.push({ id:'ammo', cost:PRICE_AMMO_REFILL });

  }
  return fail('未知商品');
}

/* ★ §1.1 刷新 6 个槽位徽标 */
function updSlots() {
  /* ★ 防御：初始化早期（武器表 W_SLOTS/解锁表尚未赋值）被调用时直接返回，
     否则 W_SLOTS[k] 会抛 "Cannot read properties of undefined (reading '0')"
     导致整段场景构建中断、地图无法进入。武器表就绪后各处的 updSlots() 会正常刷新。 */
  if (!W_SLOTS || !wpUnlocked || typeof wIdx === 'undefined') return;

  if (i === 5 && wIdx === 5) { cycleMelee(); return; }
  if (i === wIdx) return;
  if (!wpUnlocked[W_SLOTS[i].key]) { banner('未解锁 · ' + W_SLOTS[i].name + '（商店购买）'); return; }

  game.reloading = false;
  game.fireCd = Math.max(game.fireCd, 0.28);

/* 近战槽内轮换棒球棍 ↔ 斧头 */
function cycleMelee() {

  meleeSub = (meleeSub + 1) % MELEE_SUB.length;
  W.name = MELEE_SUB[meleeSub];

function throwNade() {
  if (game.dead || nadeCount <= 0) return;
  nadeCount--;
  var dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  var geo = new THREE.SphereGeometry(0.12, 8, 6);
  var mat = new THREE.MeshStandardMaterial({ color: 0x39432c, roughness: 0.62, metalness: 0.35 });
  var m = new THREE.Mesh(geo, mat);
  m.position.copy(camera.position).addScaledVector(dir, 0.6);
  scene.add(m);
  liveNades.push({
    m: m, v: dir.clone().multiplyScalar(19).add(new THREE.Vector3(0, 3.2, 0)),
    fuse: 2.5, geo: geo, mat: mat
  });
  var el = document.getElementById('nadeN');
  if (el) el.textContent = nadeCount;
}

function updateNades(dt) {
  for (var i = liveNades.length - 1; i >= 0; i--) {
    var n = liveNades[i];
    n.fuse -= dt;
    n.v.y -= 23 * dt;
    var p = n.m.position;
    var nx = p.x + n.v.x * dt, nz = p.z + n.v.z * dt, ny = p.y + n.v.y * dt;
    /* 简易地面/碰撞：直接落在地面高度 */
    var gh = 0.12;
    if (ny - 0.12 <= gh) { ny = gh + 0.12; if (n.v.y < 0) { n.v.y *= -0.3; n.v.x *= 0.6; n.v.z *= 0.6; if (Math.abs(n.v.y) < 0.9) n.v.y = 0; } }
    p.set(nx, ny, nz);
    n.m.rotation.x += dt * 7; n.m.rotation.z += dt * 5;
    if (n.fuse <= 0) {
      nadeBoom(p.clone());
      scene.remove(n.m);
      liveNades.splice(i, 1);
    }
  }
}

function nadeBoom(at) {
  var isClient = !!(window.ZS && window.ZS.isClient());
  if (typeof bloodBurst === 'function') {
    for (var k = 0; k < 14; k++) bloodBurst(at.x + (Math.random() - 0.5) * 3, at.y + Math.random() * 2, at.z + (Math.random() - 0.5) * 3);
  }
  var R = 6.5;
  for (var i = 0; i < zombies.length; i++) {
    var z = zombies[i];
    if (z.dead) continue;
    var d = Math.hypot(z.grp.position.x - at.x, z.grp.position.z - at.z);
    if (d > R) continue;
    var dmg = Math.round(60 + 170 * (1 - d / R));
    if (isClient) {
      var zid = window.ZS && ZS.idOf ? ZS.idOf(z.grp) : null;
      if (zid && window.P2P) P2P.sendHitZombie(zid, dmg);
    } else {
      damageZombie(z, dmg, { explosive: true });   // ★ §2.1 爆炸绕过装甲减伤
    }
  }
  var pd = Math.hypot(player.pos.x - at.x, player.pos.z - at.z);
  if (pd < R * 0.7) hurtPlayer(Math.round(30 * (1 - pd / (R * 0.7))));
}


function updateWeapon(dt) {
  game.fireCd = Math.max(0, game.fireCd - dt);
  if (game.shooting && !game.dead) weaponFire();
  if (game.reloading) {
    game.reloadT -= dt;
    if (game.reloadT <= 0) {
      game.reloading = false;
      /* ★ 清单⑤：换弹完成 → 从共享储备补满当前弹匣 */
      if (W.usesAmmo) {
        var need = Math.min(W.mag - game.mag, game.ammo);
        game.mag += need; game.ammo -= need;
      }
    }
  }
  game.recoil = Math.max(0, game.recoil - dt * 7);
  muzzle.material.opacity *= Math.pow(0.0001, dt);
  muzzleLight.intensity *= Math.pow(0.00001, dt);
  /* ★ 近战挥击计时推进 */
  if (game.meleeSwingT > 0) game.meleeSwingT = Math.max(0, game.meleeSwingT - dt);
  var wantRot = game.reloading ? 0.55 : 0;
  gunGrp.rotation.x += (wantRot + game.recoil * 0.1 - gunGrp.rotation.x) * Math.min(1, dt * 10);
  gunGrp.position.z = -0.42 + game.recoil * 0.055;
  /* ★ 近战挥击：在基础位移/旋转之上叠加一次横劈弧线（不影响枪械） */
  if (game.meleeSwingT > 0) {
    var mk = 1 - game.meleeSwingT / MELEE_SWING_DUR;
    var ms = Math.sin(mk * Math.PI);
    gunGrp.rotation.x -= ms * 0.95;
    gunGrp.rotation.y = ms * 0.55;
    gunGrp.rotation.z = ms * 1.25;
    gunGrp.position.z -= ms * 0.34;
    gunGrp.position.y = -0.18 - ms * 0.10;
  } else {
    gunGrp.rotation.y = 0; gunGrp.rotation.z = 0; gunGrp.position.y = -0.18;
  }
}

/* ---------- 丧尸 AI（★ 联机：客户端分支） ---------- */
/* ★ §0.1 候选目标表：本地玩家 + 所有存活远端玩家。单机模式下只有本地玩家一项。 */
function collectTargets() {
  /* ★ 观战（本地已阵亡）时把自己排除出目标表：否则丧尸会追着观战相机跑 */
  var spectating = !!(window.MP && MP.spectating && MP.spectating());
  var out = spectating ? [] : [{ id: 'local', x: player.pos.x, z: player.pos.z, y: player.pos.y, local: true }];
  try {
    if (window.MP && typeof MP.peerTargets === 'function') {
      var list = MP.peerTargets();
      for (var i = 0; i < list.length; i++) {
        var t = list[i];
        if (!t || t.alive === false) continue;
        out.push({ id: t.id, x: t.x, z: t.z, y: t.y, local: false });
      }
    }
  } catch (_) {}
  return out;
}
/* ★ §0.1 选目标：最近且可达者优先；同距时保持原锁定目标（粘性），避免左右横跳。
   map2 无寻路图，可达性用"同层或直线无阻挡"近似。 */
function pickTarget(z) {
  var cands = collectTargets();
  if (!cands.length) return null;
  /* ★ 修复：map2 的丧尸位置存于 z.grp.position（无 z.pos 字段）。
     原代码误用 map1 的 z.pos 约定，会抛 "Cannot read properties of undefined (reading 'x')"
     并让每帧渲染中断 → 黑屏。此处统一取 grp.position。 */
  var zp = (z.grp && z.grp.position) ? z.grp.position : z.pos;
  if (!zp) return null;

function updateZombies(dt) {

  if (!isClient) {
    var target = Math.min(6 + Math.floor(game.elapsed / 22), 24);
    game.wave = 1 + Math.floor(game.elapsed / 30);
    game.spawnT -= dt;
    var alive = 0;
    for (var i = 0; i < zombies.length; i++) if (!zombies[i].dead) alive++;
    /* ★ 清单⑧：BOSS 触发（房主/单机）：死亡后冷却倒计时再生成
       ★ 房主阵亡后仍应继续刷怪（房主是权威；否则队友那边永远不再来丧尸） */
    if (bossLive) {
      if (!bossRef || bossRef.dead) { bossLive = false; bossRef = null; bossCd = 45 + Math.random() * 50; }
    } else {
      bossCd -= dt;
      if (bossCd <= 0 && alive < target && (!game.dead || window.MP && MP.spectating && MP.spectating())) {
        spawnZombie({ boss: true });
        if (!bossLive) bossCd = 45 + Math.random() * 50;
      }
    }
    /* ★ §5.1 有限防守：打满目标波数且场上清空 → 胜利（不再刷怪） */
    if (LIMIT_WAVES && game.wave >= LIMIT_WAVES) {
      if (alive === 0 && !victoryDone) { triggerVictory(); }
      if (victoryDone) return;                       // 胜利后冻结刷怪
    }
    /* ★ §2.3 尸潮：每 3 波一次大波爆发（map2 基础版：临时提高刷怪上限 + 加快节奏） */
    if (game.wave >= 3 && game.wave % 3 === 0 && !game.__hordeWave) {
      game.__hordeWave = game.wave;
      game.__hordeUntil = game.elapsed + 2 + Math.floor(game.wave / 3) * 2;
      game.shake = 0.6;
      try { if (window.MP && MP.toast) MP.toast('⚠ 尸潮来袭（第 ' + game.wave + ' 波）'); } catch (_) {}
    }
    var inHorde = game.__hordeUntil && game.elapsed < game.__hordeUntil;
    if (inHorde) target = Math.round(target * 1.6);  // 尸潮期间上限提升
    /* ★ 房主阵亡（观战）时继续刷怪，保证客户端仍有丧尸可打 */
    var hostSpectating = !!(window.MP && MP.spectating && MP.spectating());
    if (game.spawnT <= 0 && alive < target && (!game.dead || hostSpectating)) {

    var worldRun = !game.dead || !!(window.MP && MP.spectating && MP.spectating());

    if (z.dead) {
      z.deadT += dt;
      z.grp.rotation.x = Math.min(1.5, z.deadT * 4.4);
      /* ★ §6.4 尸体残留 5 秒（前 1.6s 快速下沉，之后缓慢） */

      else p.y -= dt * 0.6;
      if (z.deadT > 5.0) {
        /* ★ 联机：出队时同步从 __zombies + ZS 登记表移除 */
        if (window.ZS && ZS.unregister) ZS.unregister(z.grp);
        if (z.grp.parent) z.grp.parent.remove(z.grp);
        else scene.remove(z.grp);
        var ix = (window.__zombies || []).indexOf(z.grp);
        if (ix >= 0) window.__zombies.splice(ix, 1);
        zombies.splice(i, 1);
      }
      continue;
    }

    /* ★ 联机：客户端僵尸位置由 zsync.js 的 rAF 插值控制；
       本函数只做攻击判定 + 位置动画同步 */

        z.armL.rotation.x = -1.4 - swingC;
        z.armR.rotation.x = -1.4 - swingC;

        /* 用位置变化速度驱动腿/手动画 */

        var lz = z.__lz != null ? z.__lz : p.z;
        var mv = Math.hypot(p.x - lx, p.z - lz);
        z.__lx = p.x; z.__lz = p.z;

        z.legL.rotation.x = swC;
        z.legR.rotation.x = -swC;
        z.armL.rotation.x = -1.4 + Math.sin(z.phase + 3.14) * 0.16;
        z.armR.rotation.x = -1.4 + Math.sin(z.phase) * 0.16;

      /* 面向本地玩家（zsync 会覆盖 rotation.y，这里只在必要时补充） */
      continue;
    }

    /* ============ 房主 / 单机 ============ */
    /* ★ §0.1 选目标：本地玩家 + 存活远端玩家里最近的 */
    var tgt = pickTarget(z);
    var tx = tgt ? tgt.x : player.pos.x;
    var tz = tgt ? tgt.z : player.pos.z;
    var ty = tgt ? tgt.y : player.pos.y;
    var dx = tx - p.x, dz = tz - p.z;
    var dist = Math.hypot(dx, dz);
    var dxn = 0, dzn = 0;
    if (dist > 0.001) { dxn = dx / dist; dzn = dz / dist; }
    z.grp.rotation.y = Math.atan2(-dxn, -dzn);
    /* ★ 清单⑧：BOSS 每 30 秒 60% 概率瞬移到玩家 9~16m 处 */
    if (z.boss) {
      z.tpCd -= dt;
      if (z.tpCd <= 0) {
        z.tpCd = 30;
        if (Math.random() < 0.6) {
          var ang = Math.random() * Math.PI * 2;
          var rad = 9 + Math.random() * 7;
          var nx = player.pos.x + Math.cos(ang) * rad;
          var nz = player.pos.z + Math.sin(ang) * rad;
          if (!insideAnyCollider(nx, nz, 0.9)) { p.x = nx; p.z = nz; }
        }
      }
    }
    if (dist > 1.15 && worldRun) {
      var sp = z.speed * (1 + game.wave * 0.02);
      var nx = p.x + dxn * sp * dt;
      var nz = p.z + dzn * sp * dt;
      for (var j = 0; j < zombies.length; j++) {
        if (j === i || zombies[j].dead) continue;
        var q = zombies[j].grp.position;
        var ox = nx - q.x, oz = nz - q.z;
        var od = Math.hypot(ox, oz);
        if (od < 0.85 && od > 0.001) {
          nx += ox / od * (0.85 - od) * 0.5;
          nz += oz / od * (0.85 - od) * 0.5;
        }
      }
      var cr = collideXZ(nx, nz, 0.5);
      p.x = cr[0];
      p.z = cr[1];
      z.phase += dt * (2.6 + z.speed * 1.6);
    } else if (dist <= 1.35) {
      z.atkCd -= dt;
      var swing = Math.sin(Math.max(0, 0.55 - z.atkCd) * 9) * 0.5;
      z.armL.rotation.x = -1.4 - swing;
      z.armR.rotation.x = -1.4 - swing;
      /* ★ §0.1 咬中目标：本地玩家 → 本地扣血；远端玩家 → 定向通知对端扣血 */
      if (z.atkCd <= 0 && !game.dead && tgt) {
        z.atkCd = 0.95;
        var hitDmg = z.boss ? z.bossDmg : (8 + Math.random() * 9);
        if (tgt.local) hurtPlayer(hitDmg);
        else if (window.P2P && typeof P2P.sendHitPlayer === 'function') P2P.sendHitPlayer(tgt.id, hitDmg);

    var sw = Math.sin(z.phase) * 0.55;
    z.legL.rotation.x = sw;
    z.legR.rotation.x = -sw;
    if (dist > 1.35) {
      z.armL.rotation.x = -1.4 + Math.sin(z.phase + 3.14) * 0.16;
      z.armR.rotation.x = -1.4 + Math.sin(z.phase) * 0.16;
    }
  }
}

  if (game.camLeanT > 0) camera.rotation.z = game.camLeanDir * 0.09 * game.camLeanT;

  try { renderReflection(); }
  catch (eR) { reflectionFailed = true; }
  try { renderer.render(scene, camera); }
  catch (eR2) { if (!_fatal) _fatal = eR2; }
  } catch (e) { _fatal = e; }

  /* ★ 无论本帧是否出错，加载层都要收起 */

  }

  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.6) {
    if (fpsEl) fpsEl.textContent = Math.round(fpsFrames / fpsAcc);
    fpsFrames = 0; fpsAcc = 0;

      REFL_SCALE = 0.32;
      renderer.setPixelRatio(1);
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeReflection();
    }
  }
}

<script>/* ============================================================
 * p2p.js v4 — 生化·校园突围 联机核心
 *
 * 相对 v3 的关键修复：
 *   1. 丧尸快照带稳定 id + 类型 + boss + dead 标记（不再用数组下标）
 *   2. 命中改按【丧尸稳定 id】上报结算，房主查表 → 不再打错目标
 *   3. 新增团队生命协议：dead / aliveMap / all-dead / restart
 *      · 单人阵亡 → 观战，不弹本机结算
 *      · 全员阵亡 → 房主广播 all-dead，统一定时 restart
 *   4. 玩家快照 ps 附带 alive，全员可见队友存活状态
 *
 * 依赖: peerjs 1.5.x（必须先于本文件引入）
 * ============================================================ */
const P2P = (() => {
  'use strict';
  const OPTS = { host: '0.peerjs.com', port: 443, secure: true, debug: 1 };
  const TICK_MS   = 1000 / 20;  // 玩家状态 20Hz
  const ZB_EVERY  = 2;          // 每 2 个 tick 广播一次丧尸 → 10Hz
  const GS_EVERY  = 40;         // 全局状态（波次/击杀）每 40 tick → 0.5Hz
  const CODE_RE   = /^[A-Z0-9]{6}$/;
  const RESTART_DELAY = 3000;   // 全员阵亡 → 结算显示 3 秒后统一重开

  let phase = 'off'; // off | lobby | game
  let peer = null, hostConn = null;
  let isHost = false, code = '', myName = '玩家', myId = null;

  const conns = new Map();      // 房主: peerId → {conn,name,hp,alive}
  const remotes = new Map();    // peerId → 快照(渲染用)
  let local = null, timer = null, zbGet = null, gsGet = null, tickN = 0;

  /* ---- 团队生命（房主权威）---- */
  let localAlive = true;        // 自己是否存活
  let matchOver  = false;       // 本局是否已进入"全员阵亡"流程
  let restartAt  = 0;           // 房主计划重开的时间戳

  const handlers = {};
  const on   = (e, f) => (handlers[e] = handlers[e] || []).push(f);
  const emit = (e, d) => (handlers[e] || []).forEach(f => { try { f(d); } catch (_) {} });
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function randCode() {
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += A[(Math.random() * A.length) | 0];
    return s;
  }
  function makePeer(id) {
    if (typeof Peer === 'undefined') throw { type: 'peerjs-missing' };
    return new Promise((res, rej) => {
      const p = id ? new Peer(id, OPTS) : new Peer(OPTS);
      const to = setTimeout(() => rej({ type: 'timeout' }), 15000);
      p.on('open', i => { clearTimeout(to); myId = i; res(p); });
      p.on('error', e => { if (!p.open) { clearTimeout(to); rej(e); } });
    });
  }
  function waitOpen(conn, timeout = 12000) {
    return new Promise((res, rej) => {
      if (conn.open) return res();
      const to = setTimeout(() => rej({ type: 'conn-timeout' }), timeout);
      conn.on('open',  () => { clearTimeout(to); res(); });
      conn.on('error', e => { clearTimeout(to); rej(e); });
    });
  }
  const bcast  = (m, except) => conns.forEach((c, id) => {
    if (id !== except && c.conn.open) try { c.conn.send(m); } catch (_) {}
  });
  const toHost = m => { if (hostConn && hostConn.open) try { hostConn.send(m); } catch (_) {} };
  /* 定向发送给某个客户端（房主专用）：§0.1 咬中某玩家时只发给被咬者 */
  const sendTo = (id, m) => { const c = conns.get(id); if (c && c.conn.open) try { c.conn.send(m); } catch (_) {} };

  /* ---------------- 大厅 ---------------- */
  const lobbyRoster = () => {
    const r = [{ id: myId, name: myName, isHost }];
    conns.forEach(c => r.push({ id: c.id, name: c.name || '…', isHost: false }));
    return r;
  };
  async function hostLobby(name) {
    if (phase !== 'off') await shutdown();
    myName = (name || '房主').slice(0, 8);
    isHost = true; phase = 'lobby';
    code = randCode();
    peer = await makePeer('zv' + code + 'L');
    peer.on('connection', conn => {
      conn.on('open', () => {
        conns.set(conn.peer, { conn, id: conn.peer, name: null, hp: 100, alive: true });
        conn.send({ t: 'lobby', code, players: lobbyRoster() });
        bcast({ t: 'lobby', code, players: lobbyRoster() }, conn.peer);
        emit('players', lobbyRoster());
      });
      conn.on('data', d => {
        if (d && d.t === 'hi') {
          const c = conns.get(conn.peer);
          if (c) c.name = (d.name || '玩家').slice(0, 8);
          bcast({ t: 'lobby', code, players: lobbyRoster() });
          emit('players', lobbyRoster());
        }
      });
      conn.on('close', () => {
        conns.delete(conn.peer);
        bcast({ t: 'lobby', code, players: lobbyRoster() });
        emit('players', lobbyRoster());
        emit('left', conn.peer);
      });
    });
    emit('players', lobbyRoster());
    return code;
  }
  async function joinLobby(codeIn, name) {
    const cd = (codeIn || '').trim().toUpperCase();
    if (!CODE_RE.test(cd)) throw { type: 'bad-code' };
    if (phase !== 'off') await shutdown();
    myName = (name || '玩家').slice(0, 8);
    isHost = false; phase = 'lobby'; code = cd;
    peer = await makePeer();
    hostConn = peer.connect('zv' + cd + 'L', { reliable: true });
    await waitOpen(hostConn);
    hostConn.send({ t: 'hi', name: myName });
    hostConn.on('data', d => {
      if (!d) return;
      if (d.t === 'lobby') emit('players', d.players);
      else if (d.t === 'start') emit('start', d);
    });
    hostConn.on('close', () => { if (phase === 'lobby') emit('kicked'); });
  }
  function startGame(map) {
    if (phase !== 'lobby' || !isHost) return;
    const seed = (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0;
    const msg = { t: 'start', code, seed, map: map.key, file: map.file };
    bcast(msg);
    setTimeout(() => emit('start', msg), 120);
  }

  /* ---------------- 对局 ---------------- */
  /* 队伍名册：含存活标记、职业、濒死标记 */
  const gameRoster = () => {
    const r = [{
      id: myId, name: myName, isHost: true,
      hp: local ? local.hp : 100, alive: localAlive,
      cls: local ? local.cls : null, down: !!(local && local.down)
    }];
    conns.forEach(c => r.push({
      id: c.id, name: c.name || '…', isHost: false,
      hp: c.hp == null ? 100 : c.hp, alive: c.alive !== false,
      cls: c.cls || null, down: !!c.down
    }));
    return r;
  };
  const aliveCount = () => {
    /* ★ §3.1 濒死不等于死亡：down==true 仍算存活（等待被救） */
    let n = localAlive ? 1 : 0;
    conns.forEach(c => { if (c.alive !== false) n++; });
    return n;
  };
  const totalCount = () => 1 + conns.size;

  /* 房主：检查是否全员阵亡 */
  function checkAllDead() {
    if (!isHost || phase !== 'game' || matchOver) return;
    if (aliveCount() > 0) return;
    matchOver = true;
    restartAt = performance.now() + RESTART_DELAY;
    emit('all-dead', { wave: null });
    bcast({ t: 'all-dead' });
  }

  async function enterGame(o) {
    if (phase !== 'off') await shutdown();
    phase = 'game';
    isHost = !!o.isHost;
    code = (o.code || '').toUpperCase();
    myName = (o.name || '玩家').slice(0, 8);
    localAlive = true; matchOver = false; restartAt = 0;
    if (isHost) {
      let ok = false;
      for (let i = 0; i < 6 && !ok; i++) {
        try { peer = await makePeer('zv' + code + 'G'); ok = true; }
        catch (e) { if (i === 5) throw e; await sleep(900); }
      }
      peer.on('connection', conn => {
        conn.on('open', () => {
          conns.set(conn.peer, { conn, id: conn.peer, name: '…', hp: 100, alive: true });
          conn.send({ t: 'you', id: conn.peer });
          conn.send({ t: 'team', roster: gameRoster() });
          emit('players', gameRoster());
        });
        conn.on('data', d => hostRecv(conn, d));
        conn.on('close', () => {
          conns.delete(conn.peer);
          remotes.delete(conn.peer);
          bcast({ t: 'left', id: conn.peer });
          emit('players', gameRoster());
          checkAllDead();
        });
      });
    } else {
      peer = await makePeer();
      hostConn = await connectRetry('zv' + code + 'G');
      hostConn.on('data', clientRecv);
      hostConn.on('close', () => emit('host-lost'));
      hostConn.send({ t: 'hi', name: myName });
    }
    timer = setInterval(netTick, TICK_MS);
    emit('game-enter', { code, isHost });
  }
  async function connectRetry(id, tries = 25) {
    for (let i = 0; i < tries; i++) {
      try {

        return c;
      } catch (_) { await sleep(1000); }
    }
